<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ingresar · track-service</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
    background: #0b1020; color: #e6e9f5;
  }
  @media (prefers-color-scheme: light) { body { background: #f5f7fb; color: #0f1832; } }
  .card {
    width: 100%; max-width: 360px; padding: 32px 28px;
    background: #121933; border: 1px solid #243066; border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  @media (prefers-color-scheme: light) { .card { background: #fff; border-color: #d8e0ee; } }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.1rem; margin-bottom: 24px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #5b8def; }
  label { display: block; font-size: 12px; color: #8c97c2; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 6px;
    border: 1px solid #243066; background: transparent; color: inherit; font: inherit;
  }
  @media (prefers-color-scheme: light) { input { border-color: #d8e0ee; } }
  input:focus { outline: 2px solid #5b8def; outline-offset: -1px; }
  button {
    width: 100%; margin-top: 22px; padding: 11px; border-radius: 6px; cursor: pointer;
    background: #5b8def; border: none; color: #fff; font: inherit; font-weight: 600;
  }
  button:hover { background: #4070d4; }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { margin-top: 14px; color: #f87272; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="brand"><span class="dot"></span> track-service</div>
    <label for="username">Usuario</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus />
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button id="submit" type="submit">Ingresar</button>
    <div class="error" id="error"></div>
  </form>
<script>
  const form = document.getElementById('form');
  const errBox = document.getElementById('error');
  const btn = document.getElementById('submit');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.textContent = '';
    btn.disabled = true; btn.textContent = 'Ingresando…';
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await r.json();
      if (r.ok && data.ok) {
        window.location = '/';
      } else {
        errBox.textContent = data.error || 'No se pudo ingresar';
        btn.disabled = false; btn.textContent = 'Ingresar';
      }
    } catch (err) {
      errBox.textContent = 'Error de conexión: ' + err;
      btn.disabled = false; btn.textContent = 'Ingresar';
    }
  });
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>track-service · fm-track</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-dot"></div> track-service</div>
    <nav class="nav" id="nav">
      <a href="#/resumen" data-view="resumen">▦  Resumen</a>
      <a href="#/vehiculos" data-view="vehiculos">▤  Vehículos</a>
      <a href="#/mapa" data-view="mapa">◎  Mapa</a>
      <a href="#/falabella" data-view="falabella">⊞  TMS</a>
      <a href="#/wise" data-view="wise">⊞  Wise</a>
      <a href="#/envios" data-view="envios">↑  Envíos</a>
    </nav>
    <div class="sidebar-footer">
      <div id="cfgFmTrack">fm-track: <span class="spinner"></span></div>
      <div id="cfgTarget" style="margin-top: 6px;">destino: <span class="spinner"></span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="pageTitle">Resumen</h1>
      <div class="spacer"></div>
      <span class="pill" id="connPill">conexión</span>
      <span class="pill" id="pollPill" title="polling automático cada 10s">auto · —</span>
      <button class="ghost" id="refreshBtn" title="Refrescar ahora (R)">↻ Refrescar</button>
    </header>
    <section class="content" id="view"></section>
  </main>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
